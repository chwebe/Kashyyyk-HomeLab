# DNS Stack role - Handlers

- name: Restart dns stack
  community.docker.docker_compose_v2:
    project_src: "{{ dns_stack_deploy_dir }}"
    state: restarted

- name: Restart dns stack technitium
  community.docker.docker_compose_v2:
    project_src: "{{ dns_stack_technitium_deploy_dir }}"
    state: restarted
