- name: Wait for Technitium API to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dns_stack_technitium_web_port }}/api/user/login?user={{ dns_stack_technitium_admin_username }}&pass={{ dns_stack_technitium_admin_password }}"
    method: GET
    status_code: 200
  register: dns_stack_technitium_api_check
  retries: "{{ dns_stack_technitium_web_ready_retries }}"
  delay: "{{ dns_stack_technitium_web_ready_delay }}"
  until: dns_stack_technitium_api_check.status == 200
  ignore_errors: true
  
- name: Extract session token
  ansible.builtin.set_fact:
    dns_stack_technitium_api_token: "{{ dns_stack_technitium_api_check.json.token }}"

- name: Clear forwarders
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dns_stack_technitium_web_port }}/api/settings/set"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ dns_stack_technitium_api_token }}"
      forwarders: ""
    status_code: 200
  register: dns_stack_technitium_set_forwarders_result
  ignore_errors: true

- name: Build block list URLs payload
  vars:
    # YAML "\n" here is one real newline; do not put join('\n') inside a double-quoted Jinja wrapper (YAML eats the backslash).
    _technitium_blocklist_nl: "\n"
  ansible.builtin.set_fact:
    technitium_block_list_payload: "{{ (dns_stack_technitium_block_list_urls | default([]) | join(_technitium_blocklist_nl)) ~ ((_technitium_blocklist_nl) if (dns_stack_technitium_allow_list_urls | default([])) | length > 0 else '') ~ (dns_stack_technitium_allow_list_urls | default([]) | map('regex_replace', '^', '!') | join(_technitium_blocklist_nl)) }}"

- name: Set Allow / Block List URLs
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dns_stack_technitium_web_port }}/api/settings/set"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ dns_stack_technitium_api_token }}"
      blockListUrls: "{{ technitium_block_list_payload }}"
    status_code: 200
  register: technitium_set_blocklist_result

- name: Trigger block list update
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dns_stack_technitium_web_port }}/api/settings/forceUpdateBlockLists?token={{ dns_stack_technitium_api_token }}"
    method: GET
    status_code: 200
  register: technitium_update_blocklist_result
  ignore_errors: true

- name: Set recursion to private networks only
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dns_stack_technitium_web_port }}/api/settings/set"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ dns_stack_technitium_api_token }}"
      recursion: "AllowOnlyForPrivateNetworks"
    status_code: 200
  register: dns_stack_technitium_set_recursion_result

- name: check if ROOT zone already exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dns_stack_technitium_web_port }}/api/zones/list?token={{ dns_stack_technitium_api_token }}"
    method: GET
    status_code: 200
  register: dns_stack_technitium_list_zones_result
  ignore_errors: true

- name: Add Secondary ROOT Zone if not present
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dns_stack_technitium_web_port }}/api/zones/create"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ dns_stack_technitium_api_token }}"
      zone: "."
      type: "Secondary"
      primaryNameServerAddresses: "b.root-servers.net,c.root-servers.net"
      zoneTransferProtocol: "Tcp"
    status_code: 200
  when:
    - dns_stack_technitium_list_zones_result.status | default(0) == 200
    - >-
      (
        (
          (dns_stack_technitium_list_zones_result.json | default({})).response
          | default({})
        ).zones | default([])
      )
      | map(attribute='name')
      | list
      | intersect(['', '.'])
      | length == 0

- name: Display Technitium DNS access information
  ansible.builtin.debug:
    msg:
      - "Technitium DNS is running"
      - "Web console: http://{{ ansible_default_ipv4.address }}:{{ dns_stack_technitium_web_port }}/"
      - "DNS (UDP/TCP): {{ ansible_default_ipv4.address }}:{{ dns_stack_technitium_dns_port }}"
      - "Compose project: {{ dns_stack_technitium_deploy_dir }}"
