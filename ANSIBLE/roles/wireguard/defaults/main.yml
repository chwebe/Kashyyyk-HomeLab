---
# WireGuard role — WireGuard VPN via wg-easy (Docker)

# Deployment directory
wireguard_deploy_dir: /opt/wireguard

# Container configuration
wireguard_image: ghcr.io/wg-easy/wg-easy:latest
wireguard_container_name: wg-easy
wireguard_restart_policy: unless-stopped

# Public host/IP WireGuard clients use to reach this server. Must be set explicitly (e.g. in the playbook or host_vars).
wireguard_host: ""

# Web UI password. Leave both empty to disable auth on the web UI (no login).
# Bcrypt hash generated with:
#   docker run --rm ghcr.io/wg-easy/wg-easy wgpw 'yourpassword'
wireguard_password: ""
wireguard_password_hash: ""

wireguard_port: 51820
wireguard_web_port: 51821
wireguard_default_address: 10.8.0.x
wireguard_default_dns: 1.1.1.1
